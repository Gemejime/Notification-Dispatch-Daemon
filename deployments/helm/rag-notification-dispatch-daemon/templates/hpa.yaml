{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rag-notification-dispatch-daemon.fullname" . }}-hpa
  labels:
    {{- include "rag-notification-dispatch-daemon.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rag-notification-dispatch-daemon.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if and .Values.autoscaling.customMetrics .Values.autoscaling.customMetrics.enabled }}
    # Prerequisite: The Prometheus Adapter rule must aggregate notification_active_sse_connections by pod across tenant_id and node_id, producing one value per pod for the HPA.
    - type: Pods
      pods:
        metric:
          name: notification_active_sse_connections
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.customMetrics.targetActiveConnections }}
    {{- end }}
{{- end }}

