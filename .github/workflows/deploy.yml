name: CD Pipeline & Secret Injection

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  pre-deploy-validation:
    name: Pre-Deployment Drift & Secret Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Prepare Environment Configuration Source
        run: |
          if [ ! -f .env.prod ]; then
            echo "[INFO] .env.prod is gitignored; using .env.example as validation baseline."
            cp .env.example .env.prod
            sed -i 's/^ENVIRONMENT=development/ENVIRONMENT=production/' .env.prod
          fi

      - name: Verify Zero Drift (.env.prod vs values.yaml)
        run: python scripts/sync_env_to_deployments.py --check-only

  deploy:
    name: Inject Secrets & Deploy to Kubernetes
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Mask Sensitive Secrets from Workflow Logs
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          CHANNEL_AUTH_SECRET: ${{ secrets.CHANNEL_AUTH_SECRET }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        run: |
          for secret_val in "$REDIS_PASSWORD" "$POSTGRES_PASSWORD" "$POSTGRES_DSN" "$CHANNEL_AUTH_SECRET" "$JWT_PUBLIC_KEY_PEM"; do
            if [ -n "$secret_val" ]; then
              echo "::add-mask::$secret_val"
            fi
          done
          echo "[SECURED] Secret masking verified for standard outputs."

      - name: Configure Kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Kubeconfig configured from repository secrets."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] KUBECONFIG secret not set; executing dry-run manifest compilation."
          fi

      - name: Provision Kubernetes Secret (Inject Credentials)
        id: provision_secrets
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          CHANNEL_AUTH_SECRET: ${{ secrets.CHANNEL_AUTH_SECRET }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        run: |
          NAMESPACE="rag-system"
          RELEASE_NAME="rag-notification-dispatch-daemon"
          SECRET_NAME="rag-notification-dispatch-daemon-secrets"

          if [ -f "$HOME/.kube/config" ]; then
            for secret_var in REDIS_PASSWORD POSTGRES_PASSWORD POSTGRES_DSN CHANNEL_AUTH_SECRET JWT_PUBLIC_KEY_PEM; do
              if [ -z "${!secret_var}" ]; then
                echo "ERROR: Required production secret ${secret_var} is unset or empty."
                exit 1
              fi
            done
            REDIS_PASS="${REDIS_PASSWORD}"
            PG_PASS="${POSTGRES_PASSWORD}"
            PG_DSN="${POSTGRES_DSN}"
            CHANNEL_SECRET="${CHANNEL_AUTH_SECRET}"
            JWT_PUB_KEY="${JWT_PUBLIC_KEY_PEM}"
          else
            echo "[DRY-RUN] Populating placeholders for dry-run manifest compilation..."
            REDIS_PASS="${REDIS_PASSWORD:-ci-placeholder-redis-pass}"
            PG_PASS="${POSTGRES_PASSWORD:-ci-placeholder-pg-pass}"
            PG_DSN="${POSTGRES_DSN:-postgres://rag_daemon_app:${PG_PASS}@pgbouncer.postgres.svc.cluster.local:6432/rag_notifications?sslmode=verify-full}"
            CHANNEL_SECRET="${CHANNEL_AUTH_SECRET:-ci-placeholder-channel-secret}"
            JWT_PUB_KEY="${JWT_PUBLIC_KEY_PEM:-ci-placeholder-jwt-public-key}"
          fi

          # Compute stable sha256 checksum of secret payload to trigger pod restart on rotation (Item 3)
          SECRET_CHECKSUM=$(printf '%s:%s:%s:%s:%s' "$REDIS_PASS" "$PG_PASS" "$PG_DSN" "$CHANNEL_SECRET" "$JWT_PUB_KEY" | sha256sum | awk '{print $1}')
          echo "secret_checksum=${SECRET_CHECKSUM}" >> "$GITHUB_OUTPUT"

          SECRET_ARGS=(
            "--from-literal=REDIS_PASSWORD=${REDIS_PASS}"
            "--from-literal=POSTGRES_PASSWORD=${PG_PASS}"
            "--from-literal=POSTGRES_DSN=${PG_DSN}"
            "--from-literal=CHANNEL_AUTH_SECRET=${CHANNEL_SECRET}"
            "--from-literal=JWT_PUBLIC_KEY_PEM=${JWT_PUB_KEY}"
          )

          if [ -f "$HOME/.kube/config" ]; then
            echo "[DEPLOY] Injecting Secret into Kubernetes namespace ${NAMESPACE}..."
            kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic "${SECRET_NAME}" \
              --namespace "${NAMESPACE}" \
              "${SECRET_ARGS[@]}" \
              --dry-run=client -o yaml | \
            kubectl annotate --local -f - "meta.helm.sh/release-name=${RELEASE_NAME}" "meta.helm.sh/release-namespace=${NAMESPACE}" -o yaml | \
            kubectl label --local -f - "app.kubernetes.io/managed-by=Helm" -o yaml | \
            kubectl apply -f -
          else
            echo "[DRY-RUN] Verifying secret manifest compilation syntax..."
            kubectl create secret generic "${SECRET_NAME}" \
              --namespace "${NAMESPACE}" \
              "${SECRET_ARGS[@]}" \
              --dry-run=client -o yaml > /dev/null
            echo "[DRY-RUN] Secret manifest successfully compiled without leaking credentials."
          fi

      - name: Build and Push Container Image
        id: docker_build
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"

          echo "[BUILD] Building container image ${IMAGE_REPO}:${IMAGE_TAG}..."
          docker build -f deployments/docker/Dockerfile -t "${IMAGE_REPO}:${IMAGE_TAG}" -t "${IMAGE_REPO}:latest" .

          AUTH_TOKEN="${GHCR_PAT:-$GITHUB_TOKEN}"
          if [ -n "$AUTH_TOKEN" ]; then
            echo "[AUTH] Authenticating to GitHub Container Registry (ghcr.io)..."
            echo "$AUTH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "[PUSH] Pushing image ${IMAGE_REPO}:${IMAGE_TAG}..."
            docker push "${IMAGE_REPO}:${IMAGE_TAG}"
            docker push "${IMAGE_REPO}:latest"
          else
            echo "[WARN] No GHCR_PAT or GITHUB_TOKEN available; skipping container push."
          fi

      - name: Deploy Helm Chart with Injected Secret Bindings
        env:
          SECRET_CHECKSUM: ${{ steps.provision_secrets.outputs.secret_checksum }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAMESPACE="rag-system"
          RELEASE_NAME="rag-notification-dispatch-daemon"
          TARGET_ENV="${{ inputs.environment || 'production' }}"
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"

          HELM_EXTRA_ARGS=(
            "--set" "secret.create=false"
            "--set" "image.repository=${IMAGE_REPO}"
            "--set" "image.tag=${IMAGE_TAG}"
          )

          PULL_SECRET_NAME="ghcr-pull-secret"
          AUTH_TOKEN="${GHCR_PAT:-}"
          if [ -n "$AUTH_TOKEN" ]; then
            if [ -f "$HOME/.kube/config" ]; then
              echo "[PULL-SECRET] Creating or updating GHCR image pull secret..."
              kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret docker-registry "${PULL_SECRET_NAME}" \
                --namespace="${NAMESPACE}" \
                --docker-server=ghcr.io \
                --docker-username="${{ github.actor }}" \
                --docker-password="${AUTH_TOKEN}" \
                --dry-run=client -o yaml | kubectl apply -f -
            fi
            HELM_EXTRA_ARGS+=("--set" "imagePullSecrets[0].name=${PULL_SECRET_NAME}")
          fi

          if [ -n "$SECRET_CHECKSUM" ]; then
            HELM_EXTRA_ARGS+=("--set" "secretChecksum=${SECRET_CHECKSUM}")
          fi

          # Apply environment-specific overrides for staging vs production
          if [ "$TARGET_ENV" = "staging" ]; then
            echo "[INFO] Configuring staging deployment profile..."
            HELM_EXTRA_ARGS+=(
              "--set" "env.ENVIRONMENT=staging"
              "--set" "replicaCount=2"
            )
          fi

          CHART_PATH="deployments/helm/rag-notification-dispatch-daemon"

          if [ -f "$HOME/.kube/config" ]; then
            echo "[DEPLOY] Executing Helm upgrade --install..."
            helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
              --namespace "${NAMESPACE}" \
              --create-namespace \
              "${HELM_EXTRA_ARGS[@]}" \
              --wait \
              --timeout 5m0s
          else
            echo "[DRY-RUN] Executing Helm template validation with secret bindings..."
            helm template "${RELEASE_NAME}" "${CHART_PATH}" \
              --namespace "${NAMESPACE}" \
              "${HELM_EXTRA_ARGS[@]}" > /dev/null
            echo "[DRY-RUN] Helm template rendered cleanly with injected configuration."
          fi

      - name: Verify Rollout Status
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          NAMESPACE="rag-system"
          kubectl rollout status deployment/rag-notification-dispatch-daemon -n "${NAMESPACE}" --timeout=120s

